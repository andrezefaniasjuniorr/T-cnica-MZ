<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background container -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)" />
  
  <!-- Subtle border highlight -->
  <rect x="6" y="6" width="500" height="500" rx="102" fill="none" stroke="#1e293b" stroke-width="4" />

  <!-- Outer circuit ring accent -->
  <circle cx="256" cy="256" r="185" fill="none" stroke="#1e3a8a" stroke-width="6" stroke-dasharray="16 12" opacity="0.6" />

  <!-- Glow effect around badge -->
  <circle cx="256" cy="256" r="140" fill="#2563eb" opacity="0.15" filter="url(#glow)" />

  <!-- Central Shield / Hexagon base -->
  <polygon points="256,110 380,180 380,320 256,390 132,320 132,180" fill="#0f172a" stroke="url(#primaryGrad)" stroke-width="8" stroke-linejoin="round" />

  <!-- Wrench Emblem (Left/Center) -->
  <g transform="translate(195, 175) rotate(-25) scale(0.65)">
    <path d="M125 15 C85 15, 52 42, 45 80 L88 123 C94 121, 100 120, 107 120 C128 120, 146 132, 155 149 L185 119 C181 101, 186 81, 200 67 C215 52, 235 47, 253 51 L223 81 L252 110 L282 80 C286 98, 281 118, 267 132 C253 146, 233 151, 215 147 L185 177 C202 186, 214 204, 214 225 C214 232, 213 238, 211 244 L254 287 C292 280, 319 247, 319 207 C319 184, 309 164, 294 150 L162 18 C151 8, 138 15, 125 15 Z" fill="url(#primaryGrad)" />
  </g>

  <!-- High-voltage Lightning Bolt (Center Right) -->
  <polygon points="275,150 215,260 265,260 235,360 315,240 265,240" fill="url(#accentGrad)" filter="url(#glow)" stroke="#020617" stroke-width="3" stroke-linejoin="round" />

  <!-- Brand Typography: "MZ PRO" -->
  <text x="256" y="445" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="44" fill="#f8fafc" letter-spacing="4">
    TÉCNICA<tspan fill="#38bdf8">MZ</tspan> <tspan fill="#f59e0b" font-size="34">PRO</tspan>
  </text>
</svg>
